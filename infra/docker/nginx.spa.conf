# SPA-fallback для nginx (React Router): все пути → index.html
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # index.html — НЕ кэшировать: он ссылается на хэшованные бандлы, и устаревший
  # index.html заставляет браузер грузить старый JS после каждого деплоя
  # (именно так фронт «не обновлялся» на проде 2026-11-16).
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
    expires -1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # статика с кэшем: имена файлов содержат хэш сборки — immutable безопасен
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
