# Моноконтейнер «всё в одном»: PostgreSQL+pgvector, API, Caddy (статика сайта и админки).
# Старт с нуля:
#   1) создайте infra/.env c POSTGRES_PASSWORD, ADMIN_PASSWORD, JWT_SECRET (см. DEPLOY.md)
#   2) docker-compose -f infra/docker-compose.all.yml --env-file infra/.env up -d --build
# Логи:      docker-compose -f infra/docker-compose.all.yml logs -f
# Стоп:      docker-compose -f infra/docker-compose.all.yml down
services:
  all:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.all
    image: investicionno-all:latest
    container_name: investicionno-all
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Переиспользуем данные из прежнего многоконтейнерного стека
      - pgdata:/var/lib/postgresql/data
      - uploads:/app/uploads
      # PKI Caddy (корневой CA) — иначе при пересборке меняется корень и ломается доверие
      - caddy_data:/root/.local/share/caddy
    # Лимиты на весь контейнер: 1 CPU, 3 ГБ ОЗУ
    cpus: '1.0'
    mem_limit: 3g
    mem_reservation: 512m
    environment:
      # Секреты обязательны — без них compose упадёт ещё на up, а не на старте API.
      # Дефолтные значения из репо запрещены (аудит 2026-11-14: публично известные
      # секреты → подделка JWT с ролью super_admin и обход пейволла).
      POSTGRES_USER: ${POSTGRES_USER:-newinvest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в infra/.env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Задайте ADMIN_PASSWORD в infra/.env (сильный пароль супер-админа)}
      JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET в infra/.env (не короче 32 символов)}
      PORT: 4000
      CORS_ORIGINS: https://xn--b1aghca0aeahc1am7c.xn--p1ai,https://admin.xn--b1aghca0aeahc1am7c.xn--p1ai
      PUBLIC_SITE_URL: https://xn--b1aghca0aeahc1am7c.xn--p1ai

volumes:
  pgdata:
    name: infra_pgdata
  uploads:
    name: infra_uploads
  caddy_data:
    name: infra_caddy_data
